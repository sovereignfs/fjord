[workspace]
members = ["cargo:."]

# Release builds, by `dist` (formerly cargo-dist). CLAUDE.md § Commands
# fixes two things about them: dist is the tool, and Linux targets musl for
# static linking.
#
# Artifacts and installers are published to GitHub Releases and fetched from
# there. There is no fjord.sh and no other host to depend on: the release is
# the distribution.
[dist]
cargo-dist-version = "0.33.0"
ci = "github"

# Both installers are generated into the release itself, so the command a
# user runs points at a GitHub Release asset and nothing else.
installers = ["shell", "powershell", "homebrew"]

# Linux is **musl**, not gnu. The README promises one Linux binary works on
# any distribution, and a glibc build does not: it inherits the build
# machine's glibc version as a floor. CI already proves the musl binary is
# statically linked and then runs it.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-musl",
  "x86_64-unknown-linux-musl",
  "x86_64-pc-windows-msvc",
]

# A release is cut by pushing a tag, and nothing else publishes.
publish-prereleases = false

# This repository releases more than the CLI, so the CLI's workflow must only
# wake for the CLI's tags. Without a namespace it triggers on *any* tag that
# looks like a version, and a `vscode-v0.1.0` tag would start it and fail.
# With one, the tag is `fjord-cli-vX.Y.Z` and the workflow file is
# `fjord-cli-release.yml`. Releases up to 0.2.0 were tagged `vX.Y.Z`, before
# this, and are finished: nothing about them runs again.
tag-namespace = "fjord-cli"

# Homebrew, through a tap: `brew install sovereignfs/tap/fjord`. dist writes a
# formula that installs the prebuilt archives already on the release, and a job
# pushes it to the tap repository on each release. That job authenticates with
# the repository secret HOMEBREW_TAP_TOKEN (RELEASING.md says how to make it);
# without the secret the release still publishes and the tap goes stale, so the
# release script checks for it before it tags.
tap = "sovereignfs/homebrew-tap"
publish-jobs = ["homebrew"]
