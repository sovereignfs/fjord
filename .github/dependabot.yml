# Bumps arrive as reviewable pull requests. Dependabot *alerts* are a
# separate, repository-level setting and are already enabled; this file is
# what produces the PRs.
version: 2
# One entry per ecosystem, and one per component that has its own. A new
# component adds its own here (RELEASING.md § Adding a component); the Rust
# crates share the one below, and a GUI app with its own lockfile needs its own.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # The dependency set was chosen deliberately (CLAUDE.md § Dependencies),
    # so a flood of individual PRs would be noise. Patch and minor bumps are
    # grouped; a major bump arrives on its own, because that is a decision.
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # The release workflow is generated by `dist`, and its `plan` job fails if the
    # file differs from what `dist` generates. A Dependabot bump of an action in
    # it (it tried actions/checkout 6 to 7, which dist 0.33 does not generate)
    # turns every check on the PR red, and would fail a real release the same
    # way. Its actions are bumped by upgrading `dist`, not here. The workflows
    # written by hand (ci.yml, audit.yml) are still updated.
    exclude-paths:
      - ".github/workflows/fjord-cli-release.yml"

  # Fjord Web is its own pnpm project with its own lockfile (clients/web). As for
  # the crates, minor and patch bumps are grouped and a major arrives alone.
  - package-ecosystem: npm
    directory: /clients/web
    schedule:
      interval: weekly
    groups:
      # @sovereignfs/ui is pre-1.0, so a minor bump can break a page; it gets its own PR,
      # which is read as the design change it is, and is not grouped with the rest.
      design-system:
        patterns: ["@sovereignfs/ui"]
      minor-and-patch:
        update-types: ["minor", "patch"]
        exclude-patterns: ["@sovereignfs/ui"]
    open-pull-requests-limit: 5
