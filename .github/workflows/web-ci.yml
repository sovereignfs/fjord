# Continuous integration for Fjord Web (clients/web).
#
# The Rust crates have their own workflow (ci.yml), and each component has one of
# its own (CLAUDE.md § Adding a component): this one runs only for a change that
# can affect Fjord Web, and ci.yml does not run for it. Like ci.yml it always
# starts, and a cheap `changes` job first works out what the change touches
# (scripts/ci-changes.sh); every other job needs it, so a change to Fjord Web's
# documents alone runs nothing more. The workflow always reports, so skipped jobs
# count as passed and a branch protection rule can require these checks.
#
# Four things are checked:
#
# 1. `check` type-checks and builds the app, and checks that the committed migrations
#    are the ones the schemas generate.
# 2. `tests` runs once per database the app supports (clients/web/DESIGN.md §14): an
#    sqld service, a plain SQLite file and PostgreSQL. Each leg starts its database,
#    boots a built instance against it from nothing (the server makes its own
#    namespaces, schemas and tables), and then runs the whole suite, so a test that
#    passes on one database and not another is caught where it is written.
# 3. `e2e` runs the browser tests: the built app, in Chromium, with a virtual authenticator
#    for passkeys (clients/web/playwright.config.ts). It uses a file database and needs no
#    service, so it does not repeat across the database legs.
# 4. `image` builds the container image (clients/web/Dockerfile) and brings it up in each of the
#    three documented setups from nothing (clients/web/deploy/): sqld, a file, PostgreSQL.
#
# A leg sets the variables an operator would set (DB_DIALECT, SQLITE_URL,
# SQLD_ADMIN_URL, POSTGRES_DB_URL) and the boot uses them as they are. The tests are
# given the same values under FJORD_TEST_* names instead, because they drop whole
# schemas and namespaces and must never be pointed at a real database by the
# variables a developer might have exported (src/db/test-support.ts).
name: Web CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `ready_for_review` is how a draft starts running CI, and `labeled` and
    # `unlabeled` are how `skip-ci` takes effect straight away.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  # So that a dependency's new release cannot quietly break the build unnoticed
  # between commits.
  schedule:
    - cron: "0 6 * * 1"

# A pull request that is a draft, or carries the `skip-ci` label, runs nothing:
# the `changes` job has the guard, and every other job needs it. A push to main
# and the weekly schedule always run, and the schedule runs every job, because it
# exists to catch what a dependency broke.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The database images are pinned, not `latest`: a database that changes under a
  # test run is not something a CI setup should have. Bump them deliberately.
  # PostgreSQL matches Sovereign's docker-compose.postgres.yml. sqld must be 0.24.33 or
  # later: earlier releases (the newest GitHub *release* is 0.24.32, which is why this is
  # easy to get wrong) ignore the `x-namespace` header, so every namespace is the one
  # default database and the app's tables and better-auth's would share it. The image
  # tag exists without a release; a test (src/db/provision.test.ts) checks isolation.
  SQLD_IMAGE: ghcr.io/tursodatabase/libsql-server:v0.24.33
  POSTGRES_IMAGE: postgres:16-alpine

jobs:
  # Works out what this change touches. It carries the draft / skip-ci guard, so
  # on a draft it is skipped and everything that needs it is skipped with it.
  changes:
    name: what changed
    runs-on: ubuntu-24.04
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.labels.*.name, 'skip-ci'))
    outputs:
      web: ${{ steps.classify.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The same step as ci.yml's: the classifier is shared, and each workflow
      # reads the output it cares about.
      - id: classify
        name: Classify the changed paths
        run: |
          set -euo pipefail
          base=""
          case "${{ github.event_name }}" in
            pull_request) base="${{ github.event.pull_request.base.sha }}" ;;
            push) base="${{ github.event.before }}" ;;
          esac
          # No base to compare with (a schedule, a new branch, a force-push that
          # lost the old tip): run everything rather than guess.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] ||
             ! git cat-file -e "$base^{commit}" 2>/dev/null ||
             [ "${{ github.event_name }}" = "schedule" ]; then
            echo "No base to compare against, so running everything."
            printf 'web=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed since ${base:0:7}:"
          git diff --name-only "$base" HEAD | sed 's/^/  /'
          git diff --name-only "$base" HEAD | scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"

  check:
    name: type-check and build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: clients/web
    steps:
      - uses: actions/checkout@v7

      # The pnpm version is the one in package.json's `packageManager`, so the
      # declaration and the thing that runs cannot drift apart.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: clients/web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            clients/web/pnpm-lock.yaml
            packages/fjord-editor/pnpm-lock.yaml

      # `--frozen-lockfile` fails if package.json and the lockfile disagree, which
      # is the point: the lockfile is what was reviewed.
      - run: pnpm install --frozen-lockfile

      # The app imports the editors' package, which is linked and has to be built before it is type-checked or built
      # (ROADMAP 1b.2).
      - uses: ./.github/actions/build-editor
      - run: pnpm typecheck
      - run: pnpm build

      # A schema changed without its migration, or a migration was edited by hand,
      # if generating from the committed schemas writes anything (DESIGN.md §14).
      - name: The committed migrations match the schemas
        run: |
          node scripts/db-generate.mjs ci_check
          if [ -n "$(git status --porcelain -- migrations)" ]; then
            echo "::error::the schemas generate migrations that are not committed (run pnpm db:generate <name>)"
            git status --short -- migrations
            exit 1
          fi

  tests:
    name: tests (${{ matrix.database }})
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      # One database failing says something about it; the others still run, so
      # the failure can be told apart from a bug that is not about databases.
      fail-fast: false
      matrix:
        database: [sqld, file, postgres]
    defaults:
      run:
        working-directory: clients/web
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: clients/web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            clients/web/pnpm-lock.yaml
            packages/fjord-editor/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # The web client runs the format as WebAssembly built from fjord-core (crates/fjord-wasm); the tests
      # read it from where it is built (ROADMAP 1a.11). A missing module is a failure here, not a skip.
      - uses: ./.github/actions/build-wasm

      # A fresh instance is built below, and the build imports the editors' package.
      - uses: ./.github/actions/build-editor

      # sqld is run with `docker run` and not as a service container, because a
      # service container cannot be given arguments and sqld needs
      # `--enable-namespaces` (one namespace per logical database, the analogue of
      # PostgreSQL's schemas: `fjord` for the app, `fjord_auth` for better-auth).
      # The invocation is Sovereign's own (scripts/ensure-sqld.ts). The namespaces
      # are not made here: the server makes them when it starts, which is the point.
      - name: Start sqld
        if: matrix.database == 'sqld'
        run: |
          docker run -d --name sqld \
            -p 8080:8080 -p 8081:8081 \
            -e SQLD_NODE=primary \
            -e SQLD_ADMIN_LISTEN_ADDR=0.0.0.0:8081 \
            "$SQLD_IMAGE" /bin/sqld --enable-namespaces
          for attempt in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health)" = 200 ]; then
              echo "sqld is healthy after $attempt attempt(s)"
              break
            fi
            if [ "$attempt" = 30 ]; then
              echo "::error::sqld did not become healthy"
              docker logs sqld
              exit 1
            fi
            sleep 1
          done
          {
            echo "DB_DIALECT=sqlite"
            echo "SQLITE_URL=http://localhost:8080"
            echo "SQLD_ADMIN_URL=http://localhost:8081"
          } >> "$GITHUB_ENV"

      # The file form needs no service: a database file on a local disk, with the
      # auth database beside it, as the design says (§14).
      - name: Prepare a SQLite file
        if: matrix.database == 'file'
        run: |
          mkdir -p "$RUNNER_TEMP/fjord-data"
          {
            echo "DB_DIALECT=sqlite"
            echo "SQLITE_URL=file:$RUNNER_TEMP/fjord-data/fjord.db"
          } >> "$GITHUB_ENV"

      # These credentials belong to a container that lives for this job only.
      - name: Start PostgreSQL
        if: matrix.database == 'postgres'
        run: |
          docker run -d --name postgres \
            -p 5432:5432 \
            -e POSTGRES_USER=fjord \
            -e POSTGRES_PASSWORD=fjord \
            -e POSTGRES_DB=fjord \
            "$POSTGRES_IMAGE"
          for attempt in $(seq 1 30); do
            if docker exec postgres pg_isready -U fjord -d fjord >/dev/null 2>&1; then
              echo "PostgreSQL is ready after $attempt attempt(s)"
              break
            fi
            if [ "$attempt" = 30 ]; then
              echo "::error::PostgreSQL did not become ready"
              docker logs postgres
              exit 1
            fi
            sleep 1
          done
          {
            echo "DB_DIALECT=postgres"
            echo "POSTGRES_DB_URL=postgres://fjord:fjord@localhost:5432/fjord"
          } >> "$GITHUB_ENV"

      # The same settings, under the names the tests read. See the header.
      - name: Point the tests at this leg's database
        run: |
          for name in DB_DIALECT SQLITE_URL SQLD_ADMIN_URL POSTGRES_DB_URL; do
            value="${!name:-}"
            if [ -n "$value" ]; then echo "FJORD_TEST_$name=$value" >> "$GITHUB_ENV"; fi
          done
          echo "DB_DIALECT=$DB_DIALECT"
          echo "SQLITE_URL=${SQLITE_URL:-}"
          echo "POSTGRES_DB_URL set: $([ -n "${POSTGRES_DB_URL:-}" ] && echo yes || echo no)"

      # A fresh instance, from the documented variables alone: the built server is
      # started against the empty database, makes what it needs, and answers its
      # health check on the right dialect (ROADMAP 1a.0).
      - run: pnpm build
      - name: A fresh instance boots
        run: pnpm boot-check

      # What the web client creates is held to what the CLI says about it (clients/web/src/files/cli.test.ts, ROADMAP
      # 1b.7): the real `fjord verify` over a checkout of the files it made. One leg builds the CLI; the tests are
      # skipped without it, so the other legs do not have to. This is a repository-root build, not clients/web's.
      - name: Build the CLI
        if: matrix.database == 'file'
        working-directory: .
        run: |
          cargo build --locked -p fjord-cli
          echo "FJORD_CLI=$GITHUB_WORKSPACE/target/debug/fjord" >> "$GITHUB_ENV"

      - run: pnpm test

  e2e:
    name: browser tests
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: clients/web
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: clients/web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            clients/web/pnpm-lock.yaml
            packages/fjord-editor/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # The server under test reads repositories with the format module, so it has to be built first.
      - uses: ./.github/actions/build-wasm

      # The pages under test render the editors, which are the package's, built.
      - uses: ./.github/actions/build-editor

      # The browser build has to match the Playwright version in the lockfile, so it is
      # fetched here and not baked into anything. `--with-deps` adds the system libraries
      # Chromium needs on a bare runner.
      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm build
      - run: pnpm e2e

      # The trace of a failed test shows every step, request and screenshot.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            clients/web/playwright-report
            clients/web/test-results
          retention-days: 7

  # The container image, as an operator runs it (ROADMAP 1a.12): built from the Dockerfile, which builds the
  # format module itself, and brought up with the compose files in clients/web/deploy/ in each of the three
  # database setups. scripts/deploy-check.sh says what is checked. Nothing here is pushed anywhere.
  image:
    name: the image, in each setup
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: clients/web/Dockerfile
          load: true
          tags: fjord-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Each setup comes up, keeps what it is given, and a bad setting stops it
        env:
          FJORD_IMAGE: fjord-web:ci
        run: clients/web/scripts/deploy-check.sh
