name: Release

# Written by `npm create @sovereignfs app sync` from sovereign.json; do not edit it here (CONTRIBUTING.md, "Shared files"). When a
# promotion pull request titled `Release …` is merged, the workflow every repository of the suite shares checks the title against the
# merged code and tags the merge commit with each version it names; each component released is then published by its own workflow
# (RELEASING.md). A title without `Release` publishes nothing.
on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    permissions:
      contents: write
    uses: sovereignfs/sovereign/.github/workflows/app-release.yml@ef1ddb5f623ba702fc34c8769b4b2f98c6f61ed8

  publish-cli:
    name: Publish cli
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.tags || '{}')['cli'] != null }}
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/fjord-cli-release.yml
    with:
      tag: ${{ fromJSON(needs.plan.outputs.tags || '{}')['cli'] }}
    secrets: inherit

  publish-web:
    name: Publish web
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.tags || '{}')['web'] != null }}
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/web-release.yml
    with:
      tag: ${{ fromJSON(needs.plan.outputs.tags || '{}')['web'] }}
    secrets: inherit
