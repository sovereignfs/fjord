# Continuous integration for the Rust crates: fjord-core and the CLI.
#
# This repository holds more than that (see CLAUDE.md § Repository layout), and
# each component has its own workflow. The workflow always starts, but a cheap
# `changes` job first works out what the change touches
# (scripts/ci-changes.sh), and every other job runs only if it can be affected:
# a change to documentation alone runs nothing else. Because the workflow always
# reports, skipped jobs count as passed, so a branch protection rule can require
# these checks.
#
# Four things are checked, and the order below is the order they matter in:
#
# 1. `interop` proves this crate and the reference `age` implementation
#    agree. CLAUDE.md calls it the most important test in the repository,
#    and it is what backs the format's promise that `age -d` alone recovers
#    a file. It runs first and alone so a failure is unmistakable.
# 2. `test` runs everything on Linux and macOS.
# 3. `lint` holds `clippy -- -D warnings` and `cargo fmt --check`.
# 4. `msrv` and `musl` check the two claims the README makes about builds:
#    the lowest supported toolchain, and a statically linked Linux binary.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `ready_for_review` is how a draft starts running CI, and `labeled` and
    # `unlabeled` are how `skip-ci` takes effect straight away.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  # So that a dependency's new release cannot quietly break the build
  # unnoticed between commits.
  schedule:
    - cron: "0 6 * * 1"

# A pull request that is a draft, or carries the `skip-ci` label, runs nothing:
# the `changes` job has the guard, and every other job needs it. A push to main
# and the weekly schedule always run, and the schedule runs every job, because
# it exists to catch what a dependency broke. `[skip ci]` in the head commit
# message also works, natively, for pushes.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Runner images are pinned rather than `latest`. GitHub is migrating
# `ubuntu-latest` to Ubuntu 26 from 2026-10-19, and an OS change that
# arrives on its own schedule is exactly what a CI setup should not have:
# `age` comes from apt here, and whether that package exists and under what
# name is the environment's business, not ours. Bump this deliberately, and
# let the weekly scheduled run catch what the bump breaks.
env:
  CARGO_TERM_COLOR: always
  # A dependency fetch is not a thing to retry silently.
  CARGO_NET_RETRY: 2
  RUST_BACKTRACE: 1

jobs:
  # Works out what this change touches. It carries the draft / skip-ci guard, so
  # on a draft it is skipped and everything that needs it is skipped with it.
  changes:
    name: what changed
    runs-on: ubuntu-24.04
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.labels.*.name, 'skip-ci'))
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      scripts: ${{ steps.classify.outputs.scripts }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: classify
        name: Classify the changed paths
        run: |
          set -euo pipefail
          base=""
          case "${{ github.event_name }}" in
            pull_request) base="${{ github.event.pull_request.base.sha }}" ;;
            push) base="${{ github.event.before }}" ;;
          esac
          # No base to compare with (a schedule, a new branch, a force-push that
          # lost the old tip): run everything rather than guess.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] ||
             ! git cat-file -e "$base^{commit}" 2>/dev/null ||
             [ "${{ github.event_name }}" = "schedule" ]; then
            echo "No base to compare against, so running everything."
            printf 'rust=true\nscripts=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed since ${base:0:7}:"
          git diff --name-only "$base" HEAD | sed 's/^/  /'
          git diff --name-only "$base" HEAD | scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"

  # The test that backs the recovery promise, on its own.
  interop:
    name: age cross-validation
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install the reference age implementation
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends age
          age --version
          tar --version | head -1

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: interop-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      # `age_interop` skips itself when the binary is absent, and asserts
      # its presence when CI is set — so a failed install fails the job
      # rather than quietly reducing coverage.
      - run: cargo test --workspace --test age_interop --test id_naming

  test:
    name: test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install age (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends age

      - name: Install age (macOS)
        if: runner.os == 'macOS'
        run: brew install age

      # `fjord init` and `fjord sync` make real commits, and git refuses
      # without an identity. The tests set one per-invocation; this covers
      # anything that shells out differently.
      - name: Configure git
        run: |
          git config --global user.name "Fjord CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: test-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked

  # The release builds for Windows and the README advertises it, but no job
  # here ever compiled for it — so `signal_hook::iterator`, which is
  # Unix-only, reached the release pipeline before anything noticed. This
  # job is cheaper than finding that out from a failed release.
  #
  # It compiles rather than tests: the suite drives editors through
  # `#!/bin/sh` scripts and sends signals with `kill`, so running it on
  # Windows is a separate piece of work. Clippy covers the test code, which
  # is where a platform-gated API is most easily missed.
  windows:
    name: Windows builds
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - name: Install components
        run: rustup component add clippy

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: windows-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - run: cargo build --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  lint:
    name: clippy and rustfmt
    needs: changes
    # clippy and rustfmt need the Rust; shellcheck needs the scripts.
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install components
        if: needs.changes.outputs.rust == 'true'
        run: rustup component add clippy rustfmt

      - uses: actions/cache@v6
        if: needs.changes.outputs.rust == 'true'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: lint-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - if: needs.changes.outputs.rust == 'true'
        run: cargo fmt --all --check
      # The release scripts are code that is only ever run on release day, so
      # nothing would notice a syntax error or a bashism until then. shellcheck
      # ships on the Ubuntu runner images. The classifier that decides what CI
      # runs has tests of its own, which are quick and need nothing installed.
      - if: needs.changes.outputs.scripts == 'true'
        run: shellcheck -x scripts/*.sh scripts/lib/*.sh scripts/release/*.sh
      - if: needs.changes.outputs.scripts == 'true'
        run: scripts/test-ci-changes.sh
      # On stable rather than on the MSRV: lints change between releases,
      # and the useful question is whether the code is clean under the
      # current ones.
      - if: needs.changes.outputs.rust == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # `fjord-core`'s pure subset built for WebAssembly, and what runs on top of it (ROADMAP P4): the crate's
  # own tests, the module and its JavaScript glue for Node and a browser, and the JavaScript suite that runs
  # the conformance fixtures through the module and holds it to the CLI's answers. The crate is a workspace
  # of its own (its own lockfile), so this job is separate from the CLI's matrix.
  wasm:
    name: WebAssembly build
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: crates/fjord-wasm
    steps:
      - uses: actions/checkout@v7

      - name: Add the lint components
        run: rustup component add clippy rustfmt

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Builds the module and its JavaScript glue (the same step the web client's jobs use); the lints and the
      # crate's own tests below then run against a warm cache.
      - uses: ./.github/actions/build-wasm

      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo clippy --locked --manifest-path ../fjord-core/Cargo.toml --no-default-features --all-targets -- -D warnings
      - run: cargo test --locked

      # The pure subset itself: it builds for the target it exists for, and its own tests pass without
      # `age`, `tar` or a disk.
      - name: fjord-core's pure subset builds for wasm32
        run: cargo build --locked --manifest-path ../fjord-core/Cargo.toml --no-default-features --target wasm32-unknown-unknown
      - name: fjord-core's pure subset passes its own tests
        run: cargo test --locked --manifest-path ../fjord-core/Cargo.toml --no-default-features

      - name: The conformance fixtures, through the module
        run: node --test "tests/js/*.test.mjs"

      - name: Record the size
        run: |
          raw="$(wc -c < pkg/web/fjord_wasm_bg.wasm | tr -d ' ')"
          gz="$(gzip -9 -c pkg/web/fjord_wasm_bg.wasm | wc -c | tr -d ' ')"
          echo "fjord_wasm_bg.wasm: $raw bytes, $gz gzipped" | tee -a "$GITHUB_STEP_SUMMARY"

  msrv:
    name: minimum supported Rust version
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Read from Cargo.toml rather than written here, so the declaration
      # and the thing that verifies it cannot drift apart.
      - name: Read the declared MSRV
        id: msrv
        run: |
          version="$(grep -m1 '^rust-version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          echo "Declared MSRV: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install it
        run: |
          rustup toolchain install "${{ steps.msrv.outputs.version }}" --profile minimal
          rustup default "${{ steps.msrv.outputs.version }}"
          rustc --version

      - name: Install age
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends age

      - name: Configure git
        run: |
          git config --global user.name "Fjord CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: msrv-${{ steps.msrv.outputs.version }}-${{ hashFiles('**/Cargo.lock') }}

      # Tests, not just a build: an MSRV that compiles but misbehaves is
      # not a supported version.
      - run: cargo test --workspace --locked

  musl:
    name: static musl binary
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Add the musl target
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: musl-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - run: cargo build --workspace --locked --release --target x86_64-unknown-linux-musl

      # The README says one Linux binary works on any distribution. That is
      # only true if it is genuinely static, so the claim is checked rather
      # than trusted.
      - name: Check that it is actually static
        run: |
          binary=target/x86_64-unknown-linux-musl/release/fjord
          file "$binary"
          # `file` is the authority here. `ldd` is not: on a static binary
          # it says "not a dynamic executable" on some systems and
          # "statically linked" on others, so matching against its output
          # fails in one of the two cases for the wrong reason.
          if ! file "$binary" | grep -qE "static-pie linked|statically linked"; then
            echo "::error::$binary is not statically linked, but the README says one Linux binary works on any distribution"
            ldd "$binary" || true
            exit 1
          fi

      - name: Smoke-test the binary
        run: |
          binary="$PWD/target/x86_64-unknown-linux-musl/release/fjord"
          git config --global user.name "Fjord CI"
          git config --global user.email "ci@example.invalid"
          "$binary" --version
          "$binary" init /tmp/smoke
          "$binary" -C /tmp/smoke verify
          test "$("$binary" -C /tmp/smoke verify --json | grep -c '"conforms": true')" = 1
