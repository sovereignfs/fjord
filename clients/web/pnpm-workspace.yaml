# pnpm 11 refuses to run a dependency's install script unless it is decided here,
# and `pnpm install` fails while any is undecided. A script runs on every
# developer's machine and in CI, so each one is a choice, not a default.
allowBuilds:
  # drizzle-kit pulls in esbuild, whose install script only checks that the
  # platform binary arrived; the binary comes from an optional dependency either
  # way, so the script is not needed. (drizzle-kit generate is exercised in CI.)
  esbuild: false
minimumReleaseAgeExclude:
  - '@sovereignfs/ui@0.91.0'
  - '@sovereignfs/sdk@2.1.0'
# eslint-plugin-jsx-a11y declares ESLint ^3..^9 but works on 10, as Sovereign and Tusk run it; allow exactly that one mismatch rather
# than silencing peer warnings in general.
peerDependencyRules:
  allowedVersions:
    'eslint-plugin-jsx-a11y>eslint': '10'
