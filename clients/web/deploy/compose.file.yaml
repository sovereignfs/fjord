# The smallest setup: one container, and the database is a file on a volume (clients/web/DESIGN.md §17).
#
#   cp .env.example .env     # then edit it: at least FJORD_URL, FJORD_AUTH_SECRET and FJORD_ENCRYPTION_KEY
#   docker compose -f compose.file.yaml up -d --build
#
# One process, so there is nothing to wait for and nothing else to run. It suits one person or a small group; a
# second instance cannot share the file, so this setup does not scale out.
name: fjord

services:
  web:
    build:
      context: ../../..
      dockerfile: clients/web/Dockerfile
      # The port is written in clients/web/sovereign.manifest.json, which Compose cannot read; a test holds this to it.
      args:
        PORT: '3001'
    image: ${FJORD_IMAGE:-fjord-web}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      FJORD_DB_DIALECT: sqlite
      FJORD_SQLITE_URL: file:/data/fjord.db
    volumes:
      - fjord-data:/data
    ports:
      - '127.0.0.1:${FJORD_PORT:-3001}:3001'

volumes:
  fjord-data:
