[package]
name = "fjord-cli"
description = "Reference toolchain for the Fjord repository format."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["fjord", "markdown", "git", "age", "encryption"]
categories = ["command-line-utilities"]
# The tests that read the repository's conformance fixtures (`tests/fixtures/`, at its root) stay in the repository; the rest are in the package.
exclude = ["tests/cli.rs", "tests/fix.rs", "tests/init.rs"]

[[bin]]
name = "fjord"
path = "src/main.rs"

# The package is `fjord-cli` and the command is `fjord`; the Homebrew formula is
# named for the command, so `brew install sovereignfs/tap/fjord` works.
[package.metadata.dist]
formula = "fjord"

[dependencies]
# The version is required as well as the path: `cargo publish` refuses a
# path dependency without one, and the README advertises
# `cargo install fjord-cli`.
fjord-core = { path = "../fjord-core", version = "0.3.1" }
clap.workspace = true
owo-colors.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
zeroize.workspace = true
blake3.workspace = true
ctrlc.workspace = true

[dev-dependencies]
tempfile.workspace = true
