[package]
name = "fjord-cli"
description = "Reference toolchain for the Fjord repository format."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "fjord"
path = "src/main.rs"

[dependencies]
# The version is required as well as the path: `cargo publish` refuses a
# path dependency without one, and the README advertises
# `cargo install fjord-cli`.
fjord-core = { path = "../fjord-core", version = "0.1.2" }
clap.workspace = true
owo-colors.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
zeroize.workspace = true
blake3.workspace = true
ctrlc.workspace = true

[dev-dependencies]
tempfile.workspace = true
