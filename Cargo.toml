[workspace]
members = ["crates/fjord-core", "crates/fjord-cli"]
resolver = "2"

[workspace.package]
version = "0.3.1"
edition = "2021"
# The lowest toolchain that builds this workspace, verified by the `msrv`
# job in CI rather than asserted here. 1.82 was declared originally and was
# never achievable: `time`, `ignore`, `globset` and `sha2` (via `age`) all
# require 1.88, and since `cargo install` resolves dependencies afresh,
# pinning the lockfile would not have made the older claim true for anyone.
rust-version = "1.88"
license = "MPL-2.0"
repository = "https://github.com/sovereignfs/fjord"
homepage = "https://github.com/sovereignfs/fjord"

# Pinned here so the two crates never disagree on a version.
[workspace.dependencies]
# Format
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
indexmap = { version = "2", features = ["serde"] }
# `std` (its random source) is left to the crates that need it: `fjord-core` enables it with its `native`
# feature, so the pure subset builds for WebAssembly, where a clock and a random source are injected.
ulid = { version = "3", default-features = false }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }

# Crypto. Pure Rust: keeps static musl builds clean.
#
# `armor` is enabled because `fjord verify` accepts `armor: true` (§4.1), so
# a writer unable to honour it would reject repositories its own verifier
# calls conforming.
#
# `ssh` is deliberately NOT enabled, though the same coherence argument was
# made for it in M3 and it was enabled then. It drags in `rsa`, which
# carries RUSTSEC-2023-0071 — the Marvin Attack, a key-recovery timing
# side-channel with **no fixed version available**. §6.2 makes SSH
# recipients optional ("MAY"), so the trade is an optional recipient type
# against a known, unfixable weakness in an encryption tool's dependency
# tree. `cargo deny` found it; see deny.toml.
age = { version = "0.12", features = ["armor"] }
zeroize = "1"
blake3 = "1"

# Filesystem
ignore = "0.4"
tar = "0.4"
tempfile = "3"
unicode-normalization = "0.1"

# Errors
thiserror = "2"
anyhow = "1"

# CLI only
clap = { version = "4", features = ["derive", "env"] }
owo-colors = "4"
# Signal handling for `fjord open`: the decrypted temporary file must be
# removed when an editing session ends (§11.3), and std has no API for
# installing a handler. Not in CLAUDE.md's table because the table has no
# row for this need.
#
# `ctrlc` rather than `signal-hook`, which was used first: signal-hook's
# iterator API is Unix-only, so the Windows build did not compile at all —
# and §11.3's requirement is not a Unix requirement. `termination` extends
# it from Ctrl+C to SIGTERM and SIGHUP, and to console-close on Windows.
ctrlc = { version = "3", features = ["termination"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
