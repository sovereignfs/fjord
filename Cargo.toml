[workspace]
members = ["crates/fjord-core", "crates/fjord"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/fjord-sh/fjord-cli"

# Pinned here so the two crates never disagree on a version.
[workspace.dependencies]
# Format
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
indexmap = { version = "2", features = ["serde"] }
ulid = "1"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }

# Crypto. Pure Rust: keeps static musl builds clean.
#
# `armor` and `ssh` are not default features, and both are needed for
# coherence rather than ambition: `fjord verify` accepts `armor: true`
# (§4.1) and `ssh-ed25519` recipients (§6.2), so a writer that could not
# honour either would reject repositories its own verifier calls conforming.
age = { version = "0.11", features = ["armor", "ssh"] }
zeroize = "1"
blake3 = "1"

# Filesystem
ignore = "0.4"
tar = "0.4"
tempfile = "3"
unicode-normalization = "0.1"

# Errors
thiserror = "2"
anyhow = "1"

# CLI only
clap = { version = "4", features = ["derive", "env"] }
owo-colors = "4"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
